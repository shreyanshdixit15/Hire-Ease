<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard - QuickHire</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); color: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(15,118,110,0.2); }
    .stat-card h3 { margin: 0 0 10px 0; font-size: 16px; opacity: 0.9; }
    .stat-card .stat-number { font-size: 36px; font-weight: 700; margin: 0; }
    .filters-bar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .filters-bar input, .filters-bar select { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .filters-bar input { flex: 1; min-width: 250px; }
    .filters-bar select { min-width: 150px; }
    .users-grid { display: grid; gap: 20px; }
    .user-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 20px; transition: all 0.3s; }
    .user-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.15); transform: translateY(-2px); }
    .user-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
    .user-info h3 { margin: 0 0 5px 0; color: #1e293b; font-size: 18px; }
    .user-info .role { color: #64748b; font-size: 14px; }
    .user-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-small { padding: 6px 12px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .btn-view { background: #0f766e; color: white; }
    .btn-view:hover { background: #115e59; }
    .btn-verify { background: #10b981; color: white; }
    .btn-verify:hover { background: #059669; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-delete:hover { background: #dc2626; }
    .btn-trust { background: #f97316; color: white; }
    .btn-trust:hover { background: #ea580c; }
    .user-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; font-size: 14px; }
    .detail-item { display: flex; flex-direction: column; }
    .detail-label { color: #64748b; font-size: 12px; margin-bottom: 3px; }
    .detail-value { color: #1e293b; font-weight: 500; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-verified { background: #d1fae5; color: #065f46; }
    .badge-unverified { background: #fee2e2; color: #991b1b; }
    .badge-worker { background: #ddd6fe; color: #5b21b6; }
    .badge-client { background: #fef3c7; color: #92400e; }
    .trust-score { display: flex; align-items: center; gap: 5px; }
    .trust-score-bar { flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
    .trust-score-fill { height: 100%; background: linear-gradient(90deg, #ef4444 0%, #f59e0b 50%, #10b981 100%); transition: width 0.3s; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 50px auto; padding: 30px; border-radius: 12px; max-width: 600px; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { margin: 0; color: #1e293b; }
    .close-btn { font-size: 28px; font-weight: 300; color: #64748b; cursor: pointer; border: none; background: none; }
    .close-btn:hover { color: #1e293b; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h4 { margin: 0 0 10px 0; color: #0f766e; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-grid { display: grid; gap: 12px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px; background: #f8fafc; border-radius: 6px; align-items: center; }
    .detail-row strong { color: #1e293b; font-weight: 600; }
    .detail-row span { color: #1e293b; font-weight: 500; }
    .id-type-value { background: #fef3c7; color: #78350f; padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 14px; border: 2px solid #fbbf24; }
    .audio-player { width: 100%; margin-top: 10px; }
    .trust-control { display: flex; align-items: center; gap: 15px; margin-top: 15px; }
    .trust-input { flex: 1; }
    .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
    .empty-state svg { width: 80px; height: 80px; margin-bottom: 15px; opacity: 0.5; }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="/logo.png" alt="QuickHire" style="height:48px;width:auto;margin-right:12px;border-radius:8px;">
      <div class="brand-text"><span class="brand-name" style="font-size:24px;font-weight:700;background:linear-gradient(135deg, #0f766e 0%, #14b8a6 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">QuickHire</span><span style="font-size:14px;opacity:0.7;margin-left:10px;color:#64748b;">Admin Dashboard</span></div>
    </div>
    <a href="/" style="display:flex;align-items:center;gap:6px;padding:10px 20px;background:#f1f5f9;color:#0f766e;text-decoration:none;border-radius:8px;font-weight:600;transition:all 0.3s;">← Back to Home</a>
  </header>
  
  <main class="admin-container">
    <!-- Statistics Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Users</h3>
        <p class="stat-number" id="totalUsers">0</p>
      </div>
      <div class="stat-card">
        <h3>Workers</h3>
        <p class="stat-number" id="totalWorkers">0</p>
      </div>
      <div class="stat-card">
        <h3>Verified Users</h3>
        <p class="stat-number" id="verifiedUsers">0</p>
      </div>
      <div class="stat-card">
        <h3>Pending Verification</h3>
        <p class="stat-number" id="pendingUsers">0</p>
      </div>
    </div>

    <!-- Filters Bar -->
    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="🔍 Search by name, phone, or skills...">
      <select id="roleFilter">
        <option value="all">All Roles</option>
        <option value="worker">Workers</option>
        <option value="client">Clients</option>
      </select>
      <select id="verifiedFilter">
        <option value="all">All Status</option>
        <option value="verified">Verified</option>
        <option value="unverified">Unverified</option>
      </select>
    </div>

    <!-- Users List -->
    <div id="users" class="users-grid"></div>

    <div class="site-footer" style="margin-top:40px;text-align:center;color:#64748b">Made by Shreyansh Dixit, Sargun Kaur, Shivans Singh</div>
  </main>

  <!-- User Detail Modal -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>User Details</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
let allUsers = [];

async function loadUsers() { 
  try {
    const res = await fetch('/api/admin/users'); 
    const j = await res.json(); 
    allUsers = j.users || [];
    updateStats();
    displayUsers(allUsers);
  } catch(err) {
    console.error('Error loading users:', err);
  }
}

function updateStats() {
  const total = allUsers.length;
  const workers = allUsers.filter(u => u.role === 'worker').length;
  const verified = allUsers.filter(u => u.verified).length;
  const pending = total - verified;
  
  document.getElementById('totalUsers').textContent = total;
  document.getElementById('totalWorkers').textContent = workers;
  document.getElementById('verifiedUsers').textContent = verified;
  document.getElementById('pendingUsers').textContent = pending;
}

function displayUsers(users) {
  const el = document.getElementById('users');
  el.innerHTML = '';
  
  if (users.length === 0) {
    el.innerHTML = '<div class="empty-state"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg><h3>No users found</h3><p>Try adjusting your filters</p></div>';
    return;
  }
  
  users.forEach(u => {
    const d = document.createElement('div');
    d.className = 'user-card';
    
    const verifiedBadge = u.verified 
      ? '<span class="badge badge-verified">✓ Verified</span>' 
      : '<span class="badge badge-unverified">⚠ Unverified</span>';
    
    const roleBadge = u.role === 'worker' 
      ? '<span class="badge badge-worker">Worker</span>' 
      : '<span class="badge badge-client">Client</span>';
    
    const trustScore = u.trust_score || 50;
    const trustColor = trustScore >= 75 ? '#10b981' : trustScore >= 50 ? '#f59e0b' : '#ef4444';
    
    d.innerHTML = `
      <div class="user-header">
        <div class="user-info">
          <h3>${u.name || u.phone}</h3>
          <div class="role">${roleBadge} ${verifiedBadge}</div>
        </div>
        <div class="user-actions">
          <button class="btn-small btn-view" onclick="viewDetails(${u.id})">👁️ View</button>
          ${!u.verified ? `<button class="btn-small btn-verify" onclick="verify(${u.id})">✓ Verify</button>` : ''}
          <button class="btn-small btn-trust" onclick="adjustTrust(${u.id})">⭐ Trust</button>
          <button class="btn-small btn-delete" onclick="deleteUser(${u.id})">🗑️ Delete</button>
        </div>
      </div>
      
      <div class="user-details">
        <div class="detail-item">
          <span class="detail-label">Phone</span>
          <span class="detail-value">${u.phone || 'N/A'}</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Skills</span>
          <span class="detail-value">${u.skills || 'N/A'}</span>
        </div>
        <div class="detail-item" style="grid-column: 1 / -1;">
          <span class="detail-label">Trust Score</span>
          <div class="trust-score">
            <div class="trust-score-bar">
              <div class="trust-score-fill" style="width: ${trustScore}%; background: ${trustColor};"></div>
            </div>
            <span class="detail-value">${trustScore}%</span>
          </div>
        </div>
      </div>
    `;
    
    el.appendChild(d);
  });
}

function filterUsers() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  const roleFilter = document.getElementById('roleFilter').value;
  const verifiedFilter = document.getElementById('verifiedFilter').value;
  
  let filtered = allUsers;
  
  // Search filter
  if (searchTerm) {
    filtered = filtered.filter(u => 
      (u.name || '').toLowerCase().includes(searchTerm) ||
      (u.phone || '').toLowerCase().includes(searchTerm) ||
      (u.skills || '').toLowerCase().includes(searchTerm)
    );
  }
  
  // Role filter
  if (roleFilter !== 'all') {
    filtered = filtered.filter(u => u.role === roleFilter);
  }
  
  // Verified filter
  if (verifiedFilter === 'verified') {
    filtered = filtered.filter(u => u.verified);
  } else if (verifiedFilter === 'unverified') {
    filtered = filtered.filter(u => !u.verified);
  }
  
  displayUsers(filtered);
}

function viewDetails(id) {
  const user = allUsers.find(u => u.id === id);
  if (!user) return;
  
  const modal = document.getElementById('detailModal');
  const body = document.getElementById('modalBody');
  
  const audioSection = user.voice_path ? `
    <div class="detail-section">
      <h4>Voice Resume</h4>
      <audio controls class="audio-player" src="${user.voice_path}"></audio>
    </div>
  ` : '';
  
  const idSection = user.id_doc ? `
    <div class="detail-section">
      <h4>🆔 Identification Document</h4>
      <div class="detail-grid">
        <div class="detail-row">
          <strong>ID Type:</strong>
          <span class="id-type-value">${user.id_type || 'Aadhaar Card'}</span>
        </div>
        <div class="detail-row">
          <strong>ID Status:</strong>
          <span style="color:${user.id_verified ? '#059669' : '#dc2626'};font-weight:700;">${user.id_verified ? '✓ Verified' : '⚠ Not Verified'}</span>
        </div>
        <a href="${user.id_doc}" target="_blank" class="btn-small btn-view" style="display:block;text-align:center;text-decoration:none;margin-top:10px;font-weight:600;">📄 View ID Document</a>
        ${!user.id_verified ? `<button class="btn-small btn-verify" style="width:100%;margin-top:8px;font-weight:600;" onclick="verifyId(${user.id})">✓ Verify ID</button>` : ''}
      </div>
    </div>
  ` : '';
  
  body.innerHTML = `
    <div class="detail-section">
      <h4>Basic Information</h4>
      <div class="detail-grid">
        <div class="detail-row">
          <strong>User ID:</strong>
          <span>#${user.id}</span>
        </div>
        <div class="detail-row">
          <strong>Name:</strong>
          <span>${user.name || 'Not provided'}</span>
        </div>
        <div class="detail-row">
          <strong>Phone:</strong>
          <span>${user.phone || 'N/A'}</span>
        </div>
        <div class="detail-row">
          <strong>Role:</strong>
          <span>${user.role || 'N/A'}</span>
        </div>
        <div class="detail-row">
          <strong>Verified:</strong>
          <span>${user.verified ? '✓ Yes' : '✗ No'}</span>
        </div>
        <div class="detail-row">
          <strong>Trust Score:</strong>
          <span>${user.trust_score || 50}%</span>
        </div>
      </div>
    </div>
    
    <div class="detail-section">
      <h4>Skills & Experience</h4>
      <div class="detail-grid">
        <div class="detail-row" style="display:block;">
          <strong>Skills:</strong>
          <p style="margin:8px 0 0 0;color:#64748b;">${user.skills || 'No skills listed'}</p>
        </div>
      </div>
    </div>
    
    ${audioSection}
    ${idSection}
    
    <div class="detail-section">
      <h4>Trust Score Management</h4>
      <div class="trust-control">
        <input type="number" id="trustInput" class="trust-input" min="0" max="100" value="${user.trust_score || 50}" style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;">
        <button class="btn-small btn-trust" onclick="updateTrust(${user.id})">Update Trust Score</button>
      </div>
    </div>
  `;
  
  modal.style.display = 'block';
}

function closeModal() {
  document.getElementById('detailModal').style.display = 'none';
}

async function verify(id) {
  if (!confirm('Verify this user?')) return;
  try {
    await fetch('/api/admin/verify/' + id, {method: 'POST'});
    loadUsers();
    alert('✓ User verified successfully!');
  } catch(err) {
    alert('Error verifying user');
  }
}

async function verifyId(id) {
  if (!confirm('Verify this user\'s ID document?')) return;
  try {
    await fetch('/api/admin/verify-id/' + id, {method: 'POST'});
    loadUsers();
    closeModal();
    alert('✓ ID verified successfully!');
  } catch(err) {
    alert('Error verifying ID');
  }
}

async function deleteUser(id) {
  const user = allUsers.find(u => u.id === id);
  if (!confirm(`Delete user "${user.name || user.phone}"? This action cannot be undone.`)) return;
  
  try {
    const res = await fetch('/api/admin/delete-user/' + id, {method: 'DELETE'});
    if (res.ok) {
      loadUsers();
      alert('✓ User deleted successfully!');
    } else {
      alert('Error deleting user');
    }
  } catch(err) {
    alert('Error deleting user');
  }
}

function adjustTrust(id) {
  const user = allUsers.find(u => u.id === id);
  const newScore = prompt(`Enter new trust score for "${user.name || user.phone}" (0-100):`, user.trust_score || 50);
  
  if (newScore === null) return;
  
  const score = parseInt(newScore);
  if (isNaN(score) || score < 0 || score > 100) {
    alert('Please enter a valid number between 0 and 100');
    return;
  }
  
  updateTrustScore(id, score);
}

async function updateTrust(id) {
  const score = parseInt(document.getElementById('trustInput').value);
  if (isNaN(score) || score < 0 || score > 100) {
    alert('Please enter a valid number between 0 and 100');
    return;
  }
  
  await updateTrustScore(id, score);
  closeModal();
}

async function updateTrustScore(id, score) {
  try {
    const res = await fetch('/api/admin/trust-score/' + id, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({score})
    });
    
    if (res.ok) {
      loadUsers();
      alert('✓ Trust score updated successfully!');
    } else {
      alert('Error updating trust score');
    }
  } catch(err) {
    alert('Error updating trust score');
  }
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', filterUsers);
document.getElementById('roleFilter').addEventListener('change', filterUsers);
document.getElementById('verifiedFilter').addEventListener('change', filterUsers);

// Close modal on outside click
window.onclick = function(event) {
  const modal = document.getElementById('detailModal');
  if (event.target === modal) {
    closeModal();
  }
}

// Initial load
loadUsers();
</script>
</body>
</html>
